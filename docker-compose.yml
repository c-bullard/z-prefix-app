services:
  db:
    image: postgres:14
    container_name: pg-docker
    environment:
      - DATABASE_HOST=127.0.0.1
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=docker
      - POSTGRES_DB=z-prefix
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data

  server:
    build: ./server
    environment:
      PORT: 8080
      DATABASE_URL: postgres://postgres:docker@db:5432/z-prefix
    ports:
      - '8080:8080'
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      - 'db'

  client:
    build: ./client
    restart: unless-stopped
    ports:
      - '5173:5173'
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - 'server'

volumes:
  db-data:
